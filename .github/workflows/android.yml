name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-js:
    name: Lint & Test JS Game Logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check app/src/main/assets/gameLogic.js && node --check app/src/main/assets/app.js
      - name: Run game logic tests
        run: node --test

  lint:
    name: Android Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'
          cache-disabled: true
      - name: Run Lint
        run: gradle lint

  build:
    name: Build APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'
          cache-disabled: true
          cache-read-only: false
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7