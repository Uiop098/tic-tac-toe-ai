<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe AI - Cyberpunk Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col items-center justify-between p-3 sm:p-4 min-h-screen">

    <!-- Top Container -->
    <div id="app-container" class="w-full max-w-md flex flex-col gap-3">

        <!-- Header -->
        <header class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-fuchsia-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-gamepad text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-indigo-400">
                        NEO TIC-TAC-TOE
                    </h1>
                    <p id="learnerBadge" class="text-[10px] text-indigo-300/80 font-medium">AI Learning: Calibrating 🧠</p>
                </div>
            </div>

            <!-- Quick Chat Toggle Button -->
            <button id="toggleChatBtn" class="pill-btn px-3 py-1.5 rounded-full text-xs flex items-center gap-1.5 glass-panel">
                <i class="fa-solid fa-robot text-fuchsia-400"></i>
                <span>Troll AI</span>
                <span id="unreadBadge" class="w-2 h-2 rounded-full bg-rose-500 animate-pulse hidden"></span>
            </button>
        </header>

        <!-- Grid Size Selector (3x3, 4x4, 5x5, 6x6) -->
        <div class="flex flex-col gap-1">
            <div class="flex items-center justify-between px-1 text-[11px] text-slate-400 font-semibold uppercase tracking-wider">
                <span>Grid Dimension</span>
                <span id="winRuleText" class="text-cyan-400">3-in-a-row to win</span>
            </div>
            <div class="grid grid-cols-4 gap-1.5 p-1 rounded-xl glass-panel">
                <button class="grid-btn pill-btn active py-1.5 rounded-lg text-xs font-bold" data-size="3">3x3</button>
                <button class="grid-btn pill-btn py-1.5 rounded-lg text-xs font-bold" data-size="4">4x4</button>
                <button class="grid-btn pill-btn py-1.5 rounded-lg text-xs font-bold" data-size="5">5x5</button>
                <button class="grid-btn pill-btn py-1.5 rounded-lg text-xs font-bold" data-size="6">6x6</button>
            </div>
        </div>

        <!-- Mode & Difficulty Selectors -->
        <div class="grid grid-cols-2 gap-2">
            <!-- Game Mode (AI vs PvP) -->
            <div class="flex flex-col gap-1">
                <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider px-1">Game Mode</span>
                <div class="grid grid-cols-2 gap-1 p-1 rounded-xl glass-panel">
                    <button class="mode-btn pill-btn active py-1 rounded-lg text-xs flex items-center justify-center gap-1" data-mode="ai">
                        <i class="fa-solid fa-robot text-[10px]"></i> AI
                    </button>
                    <button class="mode-btn pill-btn py-1 rounded-lg text-xs flex items-center justify-center gap-1" data-mode="pvp">
                        <i class="fa-solid fa-user-group text-[10px]"></i> PvP
                    </button>
                </div>
            </div>

            <!-- AI Difficulty Level -->
            <div id="diffContainer" class="flex flex-col gap-1">
                <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider px-1">Difficulty</span>
                <div class="grid grid-cols-4 gap-1 p-1 rounded-xl glass-panel">
                    <button class="diff-btn pill-btn py-1 rounded-lg text-[10px] font-bold diff-low" data-diff="low">Low</button>
                    <button class="diff-btn pill-btn py-1 rounded-lg text-[10px] font-bold diff-mid" data-diff="mid">Mid</button>
                    <button class="diff-btn pill-btn py-1 rounded-lg text-[10px] font-bold diff-hard" data-diff="hard">Hard</button>
                    <button class="diff-btn pill-btn active py-1 rounded-lg text-[10px] font-bold diff-impossible" data-diff="impossible">God</button>
                </div>
            </div>
        </div>

        <!-- Scoreboard & Player Stats -->
        <div class="grid grid-cols-3 gap-2">
            <div class="glass-panel rounded-xl p-2 flex flex-col items-center justify-center border-t-2 border-t-cyan-400/80">
                <span class="text-[10px] uppercase font-bold text-cyan-400 tracking-wider flex items-center gap-1">
                    <i class="fa-solid fa-xmark"></i> Player (X)
                </span>
                <span id="scoreX" class="text-xl font-black text-white">0</span>
            </div>
            <div class="glass-panel rounded-xl p-2 flex flex-col items-center justify-center border-t-2 border-t-slate-400/50">
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Ties</span>
                <span id="scoreTies" class="text-xl font-black text-white">0</span>
            </div>
            <div class="glass-panel rounded-xl p-2 flex flex-col items-center justify-center border-t-2 border-t-fuchsia-400/80">
                <span class="text-[10px] uppercase font-bold text-fuchsia-400 tracking-wider flex items-center gap-1">
                    <i class="fa-regular fa-circle"></i> AI (O)
                </span>
                <span id="scoreO" class="text-xl font-black text-white">0</span>
            </div>
        </div>

        <!-- Status / Turn Banner -->
        <div class="flex items-center justify-center min-h-[36px]">
            <div id="status">
                <span class="turn-badge x-turn">
                    <i class="fa-solid fa-bolt text-xs"></i> X's Turn
                </span>
            </div>
        </div>

        <!-- Game Board Container -->
        <div class="relative w-full flex items-center justify-center my-1">
            <div id="board" class="board glass-panel p-2 rounded-2xl">
                <!-- Dynamically generated cells -->
            </div>
            <div id="winLine" class="win-line" style="display: none;"></div>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center gap-2 mt-1">
            <button id="reset-btn" class="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-sm shadow-lg shadow-cyan-500/25 active:scale-95 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Restart Game</span>
            </button>
            <button id="resetStatsBtn" title="Reset Learned Stats" class="px-3 py-2.5 rounded-xl glass-panel text-slate-400 hover:text-rose-400 active:scale-95 transition-all text-xs font-semibold">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

    </div>

    <!-- Mini Floating In-Game Chat Drawer -->
    <div id="chatDrawer" class="chat-drawer glass-panel rounded-2xl overflow-hidden flex flex-col shadow-2xl border border-fuchsia-500/30">

        <!-- Chat Header -->
        <div class="bg-slate-900/90 px-3 py-2 flex items-center justify-between border-b border-slate-700/50 cursor-pointer" id="chatHeader">
            <div class="flex items-center gap-2">
                <div class="relative">
                    <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-fuchsia-600 to-indigo-500 flex items-center justify-center text-[10px] text-white font-bold">
                        AI
                    </div>
                    <span class="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-400 border border-slate-900"></span>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-slate-200">Troll Master AI</h3>
                    <p id="aiChatStatus" class="text-[9px] text-slate-400">Watching your every move...</p>
                </div>
            </div>
            <button id="minimizeChatBtn" class="text-slate-400 hover:text-white text-xs p-1">
                <i class="fa-solid fa-chevron-down" id="chatChevron"></i>
            </button>
        </div>

        <!-- Chat Body -->
        <div class="chat-body flex flex-col">
            <!-- Message List -->
            <div id="chatMessages" class="p-2.5 flex flex-col gap-2 max-h-44 overflow-y-auto text-xs">
                <!-- AI Welcome Message -->
                <div class="chat-bubble-ai p-2 self-start max-w-[85%]">
                    Ready to lose in binary? Make your move! 🤖⚡
                </div>
            </div>

            <!-- Quick Emoji Troll Reactions -->
            <div class="px-2 py-1.5 bg-slate-900/50 flex items-center justify-between gap-1 border-t border-slate-800">
                <button class="emoji-btn text-base hover:scale-125 transition-transform" data-emoji="😂">😂</button>
                <button class="emoji-btn text-base hover:scale-125 transition-transform" data-emoji="💀">💀</button>
                <button class="emoji-btn text-base hover:scale-125 transition-transform" data-emoji="🤡">🤡</button>
                <button class="emoji-btn text-base hover:scale-125 transition-transform" data-emoji="🔥">🔥</button>
                <button class="emoji-btn text-base hover:scale-125 transition-transform" data-emoji="🤫">🤫</button>
                <button class="emoji-btn text-base hover:scale-125 transition-transform" data-emoji="🤖">🤖</button>
            </div>

            <!-- Chat Input Bar -->
            <div class="p-2 bg-slate-900/90 flex items-center gap-1.5 border-t border-slate-800">
                <input id="chatInput" type="text" placeholder="Type a message or roast..." maxlength="80"
                       class="flex-1 bg-slate-800/80 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400">
                <button id="sendChatBtn" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-fuchsia-600 to-indigo-600 text-white text-xs font-bold active:scale-95 transition-transform">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="gameLogic.js"></script>
    <script src="bitboardEngine.js"></script>
    <script src="learningEngine.js"></script>
    <script src="chatEngine.js"></script>
    <script src="app.js"></script>
</body>
</html>
