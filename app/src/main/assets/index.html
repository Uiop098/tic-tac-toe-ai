<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe: AI Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Tic Tac Toe <span class="ai-burst">AI</span></h1>
            <p>Powered by Real LLM API</p>
        </header>
        
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="pvp">PvP Local</button>
            <button class="mode-btn" data-mode="easy-ai">Easy Bot</button>
            <button class="mode-btn" data-mode="real-ai">Real AI (API)</button>
        </div>

        <div class="game-status" id="status">Player X's Turn</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="reset-btn" class="reset-btn">Reset Game</button>
        
        <div class="ai-thinking" id="aiLoading">
            <div class="spinner"></div> AI is thinking...
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
